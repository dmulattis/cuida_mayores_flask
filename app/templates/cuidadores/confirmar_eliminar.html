<!--Sección de confirmación para eliminar un cuidador en la aplicación web de administración de cuidadores. La plantilla extiende de "base.html" y define el contenido específico para la página de confirmación, mostrando un mensaje de advertencia sobre la acción irreversible de eliminar el registro del cuidador seleccionado, junto con botones para confirmar o cancelar la eliminación.-->
{% extends "base.html" %}
{% block title %}Eliminar cuidador | Cuida a tus Mayores{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <section class="panel confirmacion p-4">
            <span class="badge etiqueta etiqueta-peligro mb-3">Desactivar perfil</span>
            <h1 class="h3">¿Eliminar a {{ cuidador.nombre }}?</h1>
            <p>El perfil dejará de aparecer en los listados, pero se conservará su historial de auditoría.</p>
            <form method="post" class="acciones d-flex flex-column flex-sm-row gap-2 mt-4">
                <button class="btn boton boton-peligro" type="submit">Sí, eliminar</button>
                <a class="btn boton boton-secundario" href="{{ url_for('cuidadores.detalle', id=cuidador.id) }}">Cancelar</a>
            </form>
        </section>
    </div>
</div>
{% endblock %}
