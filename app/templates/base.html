<!-- Plantilla base para la aplicación web de administración de cuidadores. -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cuida a tus Mayores{% endblock %}</title>

    <!-- Bootstrap 5 (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- CSS propio: se carga después de Bootstrap para poder sobrescribir estilos puntuales -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

<header class="encabezado">
    <nav class="navbar navbar-expand-md">
        <div class="container">
            <a class="navbar-brand marca" href="{{ url_for('inicio') }}">Cuida a tus Mayores</a>

            <!-- Botón hamburguesa: visible solo en pantallas chicas -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navPrincipal" aria-controls="navPrincipal"
                    aria-expanded="false" aria-label="Abrir navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navPrincipal">
                <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('cuidadores.lista') }}">Cuidadores</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn boton boton-claro" href="{{ url_for('cuidadores.crear') }}">Registrar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="container contenido py-4">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
            <div class="row">
                <div class="col-12">
                    <div class="alert alerta alerta-{{ categoria }}" role="alert">{{ mensaje }}</div>
                </div>
            </div>
        {% endfor %}
    {% endwith %}

    <div class="row">
        <div class="col-12">
            {% block content %}{% endblock %}
        </div>
    </div>
</main>

<footer class="pie">
    <div class="container">Prototipo académico de gestión de cuidadores.</div>
</footer>

<!-- Bootstrap 5 JS Bundle (incluye Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
