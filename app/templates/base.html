<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cuida a tus Mayores{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
<header class="encabezado">
    <div class="contenedor barra">
        <a class="marca" href="{{ url_for('inicio') }}">Cuida a tus Mayores</a>
        <nav aria-label="Navegación principal">
            <a href="{{ url_for('inicio') }}">Inicio</a>
            <a href="{{ url_for('cuidadores.lista') }}">Cuidadores</a>
            <a class="boton boton-claro" href="{{ url_for('cuidadores.crear') }}">Registrar</a>
        </nav>
    </div>
</header>

<main class="contenedor contenido">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
            <div class="alerta alerta-{{ categoria }}" role="alert">{{ mensaje }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>

<footer class="pie">
    <div class="contenedor">Prototipo académico de gestión de cuidadores.</div>
</footer>
</body>
</html>
